apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: airflow-db-secret-store
spec:
  provider: 
    aws:
      service: ParameterStore
      region: us-central-1 
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: aws-credentials
            key: access_key
          secretAccessKeySecretRef: 
            name: aws-credentials
            key: secret_access_key